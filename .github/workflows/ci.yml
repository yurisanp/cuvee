name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck packaging/runtime/build.sh -x
          shellcheck -s sh install/install.sh install/test-in-container.sh
          shellcheck packaging/native/*.sh packaging/native/scripts/*.sh
          # makepkg runs PKGBUILDs with errexit and sets their variables itself.
          shellcheck -s bash -e SC2034,SC2154,SC2164 \
            packaging/*/PKGBUILD packaging/cuvee-git/cuvee.install

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site (mdBook)
        run: |
          # The release download first; crates.io when GitHub's release downloads are down.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz |
            tar -xz -C /usr/local/bin mdbook ||
            cargo install mdbook --version 0.5.4 --locked --no-default-features --features search
          mdbook build docs/pt-BR
          mdbook build docs/en
          test -f site/index.html && test -f site/en/index.html

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build app
        run: cargo build --release -p cuvee-gui
      - uses: actions/upload-artifact@v4
        with:
          name: cuvee-gui
          path: target/release/cuvee-gui

  package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 180
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git namcap sudo
      - uses: actions/checkout@v4
      - name: Builder user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
      - name: namcap (PKGBUILDs)
        run: namcap packaging/*/PKGBUILD
      - name: Build reims-vgpu-git
        working-directory: packaging/reims-vgpu-git
        run: sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild
      - name: Install reims-vgpu-git
        working-directory: packaging/reims-vgpu-git
        run: pacman -U --noconfirm reims-vgpu-git-*.pkg.tar.zst
      - name: Build cuvee-git from this checkout
        working-directory: packaging/cuvee-git
        run: |
          sed -i "s|^source=.*|source=(\"cuvee::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\")|" PKGBUILD
          git config --global --add safe.directory '*'
          sudo -u builder git config --global --add safe.directory '*'
          sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild
          pacman -U --noconfirm cuvee-git-*.pkg.tar.zst
      - name: Smoke test
        run: |
          cuvee --version
          cuvee --help
          cuvee doctor --no-reims || true
          test "$(cat /usr/lib/cuvee/packaged)" = pacman
          ! cuvee install --skip-deps
          test -x /usr/lib/cuvee/qemu/bin/qemu-system-x86_64
          /usr/lib/cuvee/qemu/bin/qemu-system-x86_64 --version
          reims-ctl help >/dev/null
          reims-util --version
          namcap packaging/*/*.pkg.tar.zst || true
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packaging/*/*.pkg.tar.zst

  signing:
    # Prova que o secret MINISIGN_KEY assina e que cuvee.pub confere a assinatura.
    # Secrets não chegam a PRs de forks; aí o job só avisa.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assinar e conferir um arquivo de teste
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [[ -z $MINISIGN_KEY ]]; then
            echo "::warning::MINISIGN_KEY indisponível neste run: teste de assinatura pulado"
            exit 0
          fi
          [[ -f cuvee.pub ]] || { echo "::error::MINISIGN_KEY existe, mas cuvee.pub não está no repositório"; exit 1; }
          sudo apt-get install -y -qq minisign
          umask 077
          # Tolera CRLF, espaços sobrando e a falta da linha "untrusted comment:".
          key=$(printf '%s\n' "$MINISIGN_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$')
          [[ $key == "untrusted comment:"* ]] || key=$'untrusted comment: minisign secret key\n'"$key"
          printf '%s\n' "$key" > "$RUNNER_TEMP/cuvee.key"
          echo "cuvee signing check $GITHUB_SHA" > "$RUNNER_TEMP/probe.txt"
          printf '%s\n' "$MINISIGN_PASSWORD" |
            minisign -S -s "$RUNNER_TEMP/cuvee.key" -m "$RUNNER_TEMP/probe.txt" -t "Cuvée CI $GITHUB_SHA"
          rm -f "$RUNNER_TEMP/cuvee.key"
          minisign -Vm "$RUNNER_TEMP/probe.txt" -p cuvee.pub
          echo "Assinatura válida para a chave pública em cuvee.pub"
