name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck packaging/runtime/build.sh -x
          shellcheck -s sh install/install.sh install/test-in-container.sh
          # makepkg runs PKGBUILDs with errexit and sets their variables itself.
          shellcheck -s bash -e SC2034,SC2154,SC2164 \
            packaging/*/PKGBUILD packaging/cuvee-git/cuvee.install

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build app
        run: cargo build --release -p cuvee-gui
      - uses: actions/upload-artifact@v4
        with:
          name: cuvee-gui
          path: target/release/cuvee-gui

  package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 180
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git namcap sudo
      - uses: actions/checkout@v4
      - name: Builder user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
      - name: namcap (PKGBUILDs)
        run: namcap packaging/*/PKGBUILD
      - name: Build reims-vgpu-git
        working-directory: packaging/reims-vgpu-git
        run: sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild
      - name: Install reims-vgpu-git
        working-directory: packaging/reims-vgpu-git
        run: pacman -U --noconfirm reims-vgpu-git-*.pkg.tar.zst
      - name: Build cuvee-git from this checkout
        working-directory: packaging/cuvee-git
        run: |
          sed -i "s|^source=.*|source=(\"cuvee::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\")|" PKGBUILD
          git config --global --add safe.directory '*'
          sudo -u builder git config --global --add safe.directory '*'
          sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild
          pacman -U --noconfirm cuvee-git-*.pkg.tar.zst
      - name: Smoke test
        run: |
          cuvee --version
          cuvee --help
          cuvee doctor --no-reims || true
          test "$(cat /usr/lib/cuvee/packaged)" = pacman
          ! cuvee install --skip-deps
          test -x /usr/lib/cuvee/qemu/bin/qemu-system-x86_64
          /usr/lib/cuvee/qemu/bin/qemu-system-x86_64 --version
          reims-ctl help >/dev/null
          reims-util --version
          namcap packaging/*/*.pkg.tar.zst || true
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packaging/*/*.pkg.tar.zst
