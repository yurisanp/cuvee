name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup update stable && rustup default stable
      - name: Build cuvee-gui
        run: cargo build --release -p cuvee-gui
      - name: Pack
        run: |
          mkdir -p dist
          cp target/release/cuvee-gui dist/cuvee-gui-${GITHUB_REF_NAME}-x86_64-linux
          cd dist && sha256sum * > SHA256SUMS
      - name: Sign
        # Assina cada arquivo com minisign quando a chave existe (ver PENDENCIAS.md).
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [[ -z $MINISIGN_KEY ]]; then
            echo "::warning::MINISIGN_KEY não configurado: release sem assinatura"
            exit 0
          fi
          sudo apt-get install -y -qq minisign
          umask 077
          # Tolera CRLF, espaços sobrando e a falta da linha "untrusted comment:".
          key=$(printf '%s\n' "$MINISIGN_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$')
          [[ $key == "untrusted comment:"* ]] || key=$'untrusted comment: minisign secret key\n'"$key"
          printf '%s\n' "$key" > "$RUNNER_TEMP/cuvee.key"
          for f in dist/*; do
            [[ $f == *.minisig ]] && continue
            # A senha vai pela entrada padrão; chave sem senha a ignora.
            printf '%s\n' "$MINISIGN_PASSWORD" |
              minisign -S -s "$RUNNER_TEMP/cuvee.key" -m "$f" -t "Cuvée $GITHUB_REF_NAME $(basename "$f")"
          done
          rm -f "$RUNNER_TEMP/cuvee.key"
          if [[ -f cuvee.pub ]]; then
            for f in dist/*.minisig; do minisign -Vm "${f%.minisig}" -p cuvee.pub; done
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ -f $notes ]]; then
              gh release create "$GITHUB_REF_NAME" --title "Cuvée $GITHUB_REF_NAME" --notes-file "$notes"
            else
              gh release create "$GITHUB_REF_NAME" --title "Cuvée $GITHUB_REF_NAME" --generate-notes
            fi
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
