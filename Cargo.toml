[workspace]
resolver = "2"
members = ["crates/cuvee-core", "crates/cuvee-gui"]
# makepkg clones upstream sources under packaging/*/src; they are not ours to build here.
exclude = ["packaging"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/yurisanp/cuvee"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
