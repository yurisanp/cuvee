[package]
name = "cuvee-gui"
description = "Cuvée: macOS virtual machines on Linux, the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cuvee-gui"
path = "src/main.rs"

[dependencies]
cuvee-core = { path = "../cuvee-core" }
iced = { version = "0.14", features = ["canvas", "svg", "tokio", "advanced"] }
anyhow.workspace = true
tokio = { version = "1", features = ["rt", "process"] }
